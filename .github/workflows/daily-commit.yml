name: Daily commit

on:
  schedule:
    # Todos los días a las 12:00 UTC.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-commit
  cancel-in-progress: false

jobs:
  update-heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Actualizar registro
        run: |
          printf '# Registro diario\n\nEste archivo es actualizado automáticamente por GitHub Actions.\n\nÚltima actualización: %s UTC.\n' "$(date -u '+%Y-%m-%d %H:%M:%S')" > heartbeat.md

      - name: Crear y enviar commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.md
          git diff --cached --quiet || git commit -m "chore: daily heartbeat"
          git push
